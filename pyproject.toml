[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "scientific-literature-assistant"
version = "0.1.0"
description = "RAG-based Scientific Literature Assistant"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
]
[project.optional-dependencies]
dev = []
[tool.setuptools.packages.find]
where = ["src"]